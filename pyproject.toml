[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dribik"
version = "0.0.2b0"
description = "Dribik — authorized web pentesting workspace: crawl, scan, report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
full = [
    "httpx[http2]>=0.27",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.0",
    "pyjwt>=2.8",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/Gmblos/Dribik"
Issues = "https://github.com/Gmblos/Dribik/issues"
Repository = "https://github.com/Gmblos/Dribik"

[project.scripts]
dribik = "dribik.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dribik = ["payloads/*.txt", "templates/*.j2", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
